<div class="auth-wrapper">
  <div class="glass-card auth-card">
    <div class="auth-header">
      <div class="logo-badge">🔐</div>
      <h2>Welcome Back</h2>
      <p>Sign in to access your Intelligent OCR Workspace</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="auth-form">
      <div *ngIf="errorMessage" class="error-banner">
        ⚠️ {{ errorMessage }}
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          email
          placeholder="name@company.com"
          class="glass-input"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="••••••••"
          class="glass-input"
        />
      </div>

      <button type="submit" [disabled]="isLoading" class="btn-primary auth-btn">
        <span *ngIf="!isLoading">Sign In →</span>
        <span *ngIf="isLoading" class="spinner-small">Authenticating...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Create Account</a></p>
    </div>
  </div>
</div>
