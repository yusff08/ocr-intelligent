<div class="auth-wrapper">
  <div class="glass-card auth-card">
    <div class="auth-header">
      <div class="logo-badge">✨</div>
      <h2>Create Account</h2>
      <p>Join Intelligent OCR System</p>
    </div>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="auth-form">
      <div *ngIf="errorMessage" class="error-banner">
        ⚠️ {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="success-banner" style="background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.3); color: #86efac; padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.9rem;">
        ✅ {{ successMessage }}
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          email
          placeholder="name@company.com"
          class="glass-input"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="••••••••"
          class="glass-input"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          required
          placeholder="••••••••"
          class="glass-input"
        />
      </div>

      <button type="submit" [disabled]="isLoading" class="btn-primary auth-btn">
        <span *ngIf="!isLoading">Register Account →</span>
        <span *ngIf="isLoading" class="spinner-small">Creating Account...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Sign In</a></p>
    </div>
  </div>
</div>
